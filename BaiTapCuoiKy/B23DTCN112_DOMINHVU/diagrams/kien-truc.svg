<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1130" viewBox="0 0 1180 1130" font-family="'Liberation Sans', Arial, sans-serif"><defs><marker id="arr" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2328" stroke-width="1.6"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><circle cx="330" cy="27" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><line x1="330" y1="40" x2="330" y2="74" stroke="#1f2328" stroke-width="1.5"/><line x1="308" y1="52" x2="352" y2="52" stroke="#1f2328" stroke-width="1.5"/><line x1="330" y1="74" x2="312" y2="102" stroke="#1f2328" stroke-width="1.5"/><line x1="330" y1="74" x2="348" y2="102" stroke="#1f2328" stroke-width="1.5"/><text x="364" y="64" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="central">Nhân viên nhà thuốc A</text><circle cx="850" cy="27" r="13" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><line x1="850" y1="40" x2="850" y2="74" stroke="#1f2328" stroke-width="1.5"/><line x1="828" y1="52" x2="872" y2="52" stroke="#1f2328" stroke-width="1.5"/><line x1="850" y1="74" x2="832" y2="102" stroke="#1f2328" stroke-width="1.5"/><line x1="850" y1="74" x2="868" y2="102" stroke="#1f2328" stroke-width="1.5"/><text x="884" y="64" font-size="14" font-weight="700" fill="#1f2328" text-anchor="start" dominant-baseline="central">Nhân viên nhà thuốc B</text><rect x="80" y="140" width="500" height="220" rx="6" fill="#eef4fc" stroke="#3f6fc4" stroke-width="2"/><text x="94" y="158" font-size="15" font-weight="700" fill="#3f6fc4" text-anchor="start" dominant-baseline="central">Máy Client 1 – ứng dụng Java Swing</text><rect x="100" y="175" width="460" height="78" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="330.0" y="195.0725" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">MedicineClient (JFrame)</text><text x="330.0" y="215.7475" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">Tab: Thuốc • Công dụng • Thùng rác • Lịch sử xóa</text><text x="330.0" y="234.59749999999997" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">SwingWorker: gửi nhận trên luồng nền</text><rect x="100" y="268" width="460" height="72" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="330.0" y="294.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">ServerApi</text><text x="330.0" y="315.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">DatagramSocket – chờ phản hồi tối đa 5 giây</text><polyline points="330,106 330,138" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arr)"/><rect x="600" y="140" width="500" height="220" rx="6" fill="#eef4fc" stroke="#3f6fc4" stroke-width="2"/><text x="614" y="158" font-size="15" font-weight="700" fill="#3f6fc4" text-anchor="start" dominant-baseline="central">Máy Client 2 – ứng dụng Java Swing</text><rect x="620" y="175" width="460" height="78" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="850.0" y="195.0725" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">MedicineClient (JFrame)</text><text x="850.0" y="215.7475" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">Tab: Thuốc • Công dụng • Thùng rác • Lịch sử xóa</text><text x="850.0" y="234.59749999999997" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">SwingWorker: gửi nhận trên luồng nền</text><rect x="620" y="268" width="460" height="72" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="850.0" y="294.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">ServerApi</text><text x="850.0" y="315.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">DatagramSocket – chờ phản hồi tối đa 5 giây</text><polyline points="850,106 850,138" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arr)"/><rect x="80" y="410" width="1020" height="90" rx="6" fill="#fff7e0" stroke="#b8860b" stroke-width="2"/><text x="94" y="428" font-size="15" font-weight="700" fill="#b8860b" text-anchor="start" dominant-baseline="central">Mạng LAN / localhost – giao thức UDP</text><text x="590" y="450" font-size="14" font-weight="400" fill="#1f2328" text-anchor="middle" dominant-baseline="central">Yêu cầu:  LỆNH ⇥ tham số …        Phản hồi:  OK | ERR ⇥ nội dung (mỗi bản ghi một dòng)</text><text x="590" y="476" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">Mã hóa UTF-8, mỗi yêu cầu và phản hồi nằm gọn trong một gói tin (≤ 65 507 byte)</text><polyline points="330,360 330,408" fill="none" stroke="#1f2328" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><polyline points="850,360 850,408" fill="none" stroke="#1f2328" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><rect x="80" y="550" width="1020" height="380" rx="6" fill="#eaf6ec" stroke="#2e7d32" stroke-width="2"/><text x="94" y="568" font-size="15" font-weight="700" fill="#2e7d32" text-anchor="start" dominant-baseline="central">Máy Server – MedicineServer (Java, UDP cổng 9876)</text><rect x="390" y="585" width="400" height="66" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="590.0" y="608.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">MedicineServer</text><text x="590.0" y="629.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">DatagramSocket(9876): nhận gói → xử lý → gửi trả</text><rect x="390" y="680" width="400" height="60" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="590.0" y="700.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">RequestHandler</text><text x="590.0" y="721.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">tách lệnh, kiểm tra dữ liệu (Validation)</text><rect x="130" y="775" width="420" height="66" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="340.0" y="798.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">CatalogService</text><text x="340.0" y="819.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">xem, tìm kiếm, thêm, sửa thuốc và công dụng</text><rect x="630" y="775" width="420" height="66" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="840.0" y="798.4975" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">DeleteService (phần cá nhân)</text><text x="840.0" y="819.1725" font-size="13" font-weight="400" fill="#4a5160" text-anchor="middle" dominant-baseline="central">thùng rác, khôi phục, xóa vĩnh viễn, xóa công dụng</text><rect x="240" y="860" width="700" height="52" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/><text x="590.0" y="885.9225" font-size="15.5" font-weight="700" fill="#1f2328" text-anchor="middle" dominant-baseline="central">MedicineDao • UsageDao • DeleteLogDao • Database (JDBC, transaction)</text><polyline points="590,500 590,583" fill="none" stroke="#1f2328" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/><polyline points="590,651 590,678" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arr)"/><polyline points="500,740 500,758 340,758 340,773" fill="none" stroke="#1f2328" stroke-width="1.6" marker-end="url(#arr)"/><polyline points="680,740 680,758 840,758 840,773" fill="none" stroke="#1f2328"